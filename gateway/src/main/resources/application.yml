spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: order-service
              uri: lb://order
              predicates:
                - Path=/api/v1/orders/**
server:
  port: 9090

api:
  security:
    token:
      secret: ${JWT_SECRET:05b0f768-fe7b-49aa-b934-44ef29634de3}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
