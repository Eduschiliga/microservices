global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: eureka
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-service:8761"]
        labels:
          service: eureka

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:9090"]
        labels:
          service: gateway

  - job_name: user
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8080"]
        labels:
          service: user

  - job_name: order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081"]
        labels:
          service: order

  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8082"]
        labels:
          service: payment
