services:

  eureka-service:
    container_name: eureka-service
    build:
      context: ./eureka
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - schiliga-network

  gateway-service:
    container_name: gateway-service
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      EUREKA_URL: http://eureka-service:8761/eureka
      JWT_SECRET: 05b0f768-fe7b-49aa-b934-44ef29634de3
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      eureka-service:
        condition: service_healthy
    networks:
      - schiliga-network

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: always
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - schiliga-network

  user-service:
    container_name: user-service
    build:
      context: ./user
      dockerfile: Dockerfile
    environment:
      DB_HOST: user-postgres
      DB_PORT: 5432
      DB_NAME: userdb
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: 05b0f768-fe7b-49aa-b934-44ef29634de3
      JWT_EXPIRATION: 7200
      EUREKA_URL: http://eureka-service:8761/eureka
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      user-postgres:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - schiliga-network

  order-service:
    container_name: order-service
    build:
      context: ./order
      dockerfile: Dockerfile
    environment:
      DB_HOST: order-postgres
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URL: http://eureka-service:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      order-postgres:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - schiliga-network

  payment-service:
    container_name: payment-service
    build:
      context: ./payment
      dockerfile: Dockerfile
    environment:
      DB_HOST: payment-postgres
      DB_PORT: 5432
      DB_NAME: paymentdb
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URL: http://eureka-service:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      payment-postgres:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - schiliga-network

  user-postgres:
    image: postgres:17
    container_name: user-postgres
    restart: always
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d userdb"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - schiliga-network

  order-postgres:
    image: postgres:17
    container_name: order-postgres
    restart: always
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d orderdb"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - schiliga-network

  payment-postgres:
    image: postgres:17
    container_name: payment-postgres
    restart: always
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d paymentdb"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - schiliga-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      eureka-service:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - schiliga-network

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - schiliga-network


volumes:
  user_postgres_data:
  order_postgres_data:
  payment_postgres_data:
  grafana_data:

networks:
  schiliga-network:
    driver: bridge
    name: schiliga-network
